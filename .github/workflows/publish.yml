name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag and select npm dist-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("node:fs"); const p = require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) throw new Error("Tag must match package.json version"); fs.appendFileSync(process.env.GITHUB_ENV, `NPM_DIST_TAG=${p.version.includes("-") ? "next" : "latest"}\n`)'
      - run: npm ci --ignore-scripts
      - name: Publish using npm trusted publishing
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
